name: Build and Release Multi-Platform Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. WINDOWS STANDALONE EXE BUILDER
  # --------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pyinstaller

      - name: Run Unit Tests
        run: |
          python -m unittest tests/test_pipe_suite.py -v

      - name: Build Windows Executable (.exe)
        run: |
          pyinstaller --name "API-5L-Pipe-Windows-x64" `
            --onefile `
            --noconfirm `
            --clean `
            --noupx `
            --add-data "static;static" `
            --add-data "templates;templates" `
            --add-data "core;core" `
            --hidden-import "app" `
            --hidden-import "core" `
            --hidden-import "core.database" `
            --hidden-import "core.pipe_qaqc_engine" `
            --hidden-import "core.verification_engine" `
            --hidden-import "core.wall_thickness_engine" `
            --hidden-import "core.project_manager" `
            --hidden-import "core.updater" `
            --hidden-import "core.excel_exporter" `
            --hidden-import "core.i18n" `
            --hidden-import "uvicorn" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.loops.asyncio" `
            --hidden-import "uvicorn.protocols" `
            --hidden-import "uvicorn.protocols.http" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.http.h11_impl" `
            --hidden-import "uvicorn.protocols.websockets" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "uvicorn.lifespan" `
            --hidden-import "uvicorn.lifespan.on" `
            --hidden-import "uvicorn.lifespan.off" `
            --hidden-import "fastapi" `
            --hidden-import "starlette" `
            --hidden-import "starlette.routing" `
            --hidden-import "starlette.responses" `
            --hidden-import "starlette.middleware" `
            --hidden-import "openpyxl" `
            --hidden-import "jinja2" `
            --hidden-import "pydantic" `
            run.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: API-5L-Pipe-Windows-x64.exe
          path: dist/API-5L-Pipe-Windows-x64.exe

  # --------------------------------------------------------------------------
  # 2. MACOS STANDALONE APP & DMG BUILDER
  # --------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pyinstaller

      - name: Run Unit Tests
        run: |
          python3 -m unittest tests/test_pipe_suite.py -v

      - name: Build macOS App Bundle (.app)
        run: |
          pyinstaller \
            --name "API-5L-Pipe" \
            --windowed \
            --noconfirm \
            --clean \
            --noupx \
            --add-data "static:static" \
            --add-data "templates:templates" \
            --add-data "core:core" \
            --hidden-import "app" \
            --hidden-import "core" \
            --hidden-import "core.database" \
            --hidden-import "core.pipe_qaqc_engine" \
            --hidden-import "core.verification_engine" \
            --hidden-import "core.wall_thickness_engine" \
            --hidden-import "core.project_manager" \
            --hidden-import "core.updater" \
            --hidden-import "core.excel_exporter" \
            --hidden-import "core.i18n" \
            --hidden-import "uvicorn" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.loops.asyncio" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.http.h11_impl" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespan" \
            --hidden-import "uvicorn.lifespan.on" \
            --hidden-import "uvicorn.lifespan.off" \
            --hidden-import "fastapi" \
            --hidden-import "starlette" \
            --hidden-import "starlette.routing" \
            --hidden-import "starlette.responses" \
            --hidden-import "starlette.middleware" \
            --hidden-import "openpyxl" \
            --hidden-import "jinja2" \
            --hidden-import "pydantic" \
            run.py

      - name: Ad-hoc Code Signing & Permissions
        run: |
          chmod +x "dist/API-5L-Pipe.app/Contents/MacOS/API-5L-Pipe"
          codesign --force --deep -s - "dist/API-5L-Pipe.app" || true

      - name: Create Apple Disk Image (.dmg)
        run: |
          mkdir -p dist/dmg_root
          cp -R "dist/API-5L-Pipe.app" dist/dmg_root/
          ln -s /Applications dist/dmg_root/Applications
          hdiutil create -volname "API-5L-Pipe" \
            -srcfolder dist/dmg_root \
            -ov -format UDZO \
            "dist/API-5L-Pipe-macOS.dmg"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: API-5L-Pipe-macOS.dmg
          path: dist/API-5L-Pipe-macOS.dmg

  # --------------------------------------------------------------------------
  # 3. ATTACH PACKAGES TO GITHUB RELEASE
  # --------------------------------------------------------------------------
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: API-5L-Pipe-Windows-x64.exe
          path: release_assets/

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: API-5L-Pipe-macOS.dmg
          path: release_assets/

      - name: Publish Release Assets to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/API-5L-Pipe-Windows-x64.exe
            release_assets/API-5L-Pipe-macOS.dmg
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
